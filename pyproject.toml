[project]
name = "ecom-nl2sql-anomaly-agent"
version = "0.1.0"
description = "跨境电商 NL2SQL 智能问数与经营异常多分支并行排查 Agent（语义层 + sqlglot AST 护栏 + 自修复 + EX 自动化评测）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2.0",
    "sqlglot>=25.20.0",
    "openai>=1.55.0",
    "langgraph>=0.2.50",
    "httpx>=0.27.2",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
